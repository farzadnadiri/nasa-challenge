# Run the whole app locally: `docker compose up`, then open http://localhost:5173
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - spherex-data:/data   # processed images and uploads survive restarts

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      - API_PROXY=http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules    # Linux dependencies stay inside the container
    depends_on:
      - backend

volumes:
  spherex-data:
